apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: ima-job-lifecycle
spec:
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups: [batch]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [jobs, cronjobs]
  validations:
    - expression: "object.kind != 'Job' || (has(object.spec.ttlSecondsAfterFinished) && object.spec.ttlSecondsAfterFinished > 0)"
      message: Set a positive Job ttlSecondsAfterFinished and archive receipts before expiry.
    - expression: "object.kind != 'CronJob' || (has(object.spec.successfulJobsHistoryLimit) && has(object.spec.failedJobsHistoryLimit) && has(object.spec.concurrencyPolicy))"
      message: Declare CronJob history limits and concurrencyPolicy explicitly in source.
    - expression: "object.kind != 'CronJob' || (has(object.spec.jobTemplate.spec.ttlSecondsAfterFinished) && object.spec.jobTemplate.spec.ttlSecondsAfterFinished > 0)"
      message: Set a positive TTL in the CronJob jobTemplate.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: ima-job-lifecycle-warn
spec:
  policyName: ima-job-lifecycle
  validationActions: [Warn, Audit]
