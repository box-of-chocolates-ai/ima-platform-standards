name: Node retention image
on:
  workflow_dispatch:
  push:
    branches: [main, 'feat/scoped-node-retention-*']
    paths: ['maintenance/**', 'retention_guard.py', 'tests/test_node_retention.py', 'tests/test_apt_cache.py', 'tests/test_journals.py', '.github/workflows/retention-image.yml']
  pull_request:
    paths: ['maintenance/**', 'retention_guard.py', 'tests/test_node_retention.py', 'tests/test_apt_cache.py', 'tests/test_journals.py', '.github/workflows/retention-image.yml']
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python3 -B -m unittest discover -s tests -v
      - name: Build, offline smoke and byte budget
        run: |
          cp maintenance/.dockerignore .dockerignore
          docker build --label org.opencontainers.image.source=https://github.com/box-of-chocolates-ai/ima-platform-standards --label org.opencontainers.image.revision="${GITHUB_SHA}" -f maintenance/Dockerfile -t retention-check .
          docker run --rm --network=none --read-only --cap-drop=ALL --security-opt=no-new-privileges retention-check --help
          docker run --rm --network=none --read-only --entrypoint /usr/local/bin/crictl retention-check --version
          bytes=$(docker image inspect retention-check --format '{{.Size}}')
          echo "uncompressed_image_bytes=$bytes"
          python3 check.py --dockerfile maintenance/Dockerfile --ignore .dockerignore --image retention-check --max-image-bytes 200000000
          echo "image_bytes=$bytes" >> "$GITHUB_STEP_SUMMARY"
      - name: Scoped profile installer in restricted runtime
        run: |
          name="seccomp-installer-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          timeout 90 docker run --name "$name" --rm --network=none --read-only \
            --user=0:65532 --cap-drop=ALL --security-opt=no-new-privileges \
            --memory=128m --memory-swap=128m --cpus=1 --pids-limit=64 \
            --tmpfs=/tmp:rw,noexec,nosuid,nodev,size=32m,uid=0,gid=65532,mode=1777 \
            --mount "type=bind,source=${GITHUB_WORKSPACE},target=/source,readonly" \
            --workdir=/source --entrypoint=python3 retention-check \
            -B -m unittest discover -s tests -p test_seccomp_profile.py -v
      - name: Publish immutable source tag
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/box-of-chocolates-ai/ima-node-retention:sha-${GITHUB_SHA}"
          docker tag retention-check "$image"
          docker push "$image"
